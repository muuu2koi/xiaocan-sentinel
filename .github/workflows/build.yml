name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app-shell/build
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app-shell/build/debug.keystore
          fi

      - name: build apk
        run: |
          cd app-shell
          chmod +x build.sh
          ./build.sh

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xc-sentinel-apk
          path: app-shell/build/xc-sentinel.apk

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-shell/build/xc-sentinel.apk
          overwrite_files: true
